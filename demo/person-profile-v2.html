<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人物档案 · v2 演示（渐进式 + 三端联动）</title>
<style>
:root{
  --paper:#f5f0e8;--card:#fffdfa;--ink:#29251f;--muted:#746d63;--line:#ded5c8;
  --plum:#4d3045;--plum-soft:#e8dfe5;--terra:#b65f42;--terra-soft:#f3dfd6;
  --sage:#627a67;--sage-soft:#dfe8df;--sand:#a57c45;--sand-soft:#eee2ce;--clay:#8f4f3b;
  --red:#b44d43;--green:#477358;--shadow:0 16px 40px rgba(63,48,36,.07);--radius:22px
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Inter","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

.shell{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:272px;padding:22px 16px;background:#ede6dc;border-right:1px solid rgba(104,87,68,.12);display:flex;flex-direction:column;overflow-y:auto}
.main{margin-left:272px;flex:1;padding:24px 28px 60px;min-width:0}

.brand{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.brand .av{width:38px;height:38px;border-radius:12px;background:var(--plum);color:#fff;display:grid;place-items:center;font:700 16px/1 serif}
.brand b{display:block;font:700 16px/1.3 "Songti SC",serif}
.brand small{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
.back{padding:7px 11px;border-radius:9px;background:rgba(255,255,255,.6);color:var(--muted);font-size:12px;font-weight:600;margin-bottom:14px;display:inline-flex;align-items:center;gap:5px}
.back:hover{background:#fff;color:var(--ink)}

.p-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.p-head span{font-size:11px;color:var(--muted);font-weight:700}
.p-head button{font-size:11px;color:var(--plum);font-weight:700}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid transparent;border-radius:12px;background:rgba(255,255,255,.55);text-align:left;width:100%;transition:.15s}
.pitem:hover{background:#fff}
.pitem.on{background:var(--plum);border-color:var(--plum)}
.pitem.on .nm,.pitem.on .mt,.pitem.on .go{color:#fff}
.pitem.on .av{background:rgba(255,255,255,.22)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 14px/1 serif;color:#fff;flex:0 0 auto}
.pinfo{min-width:0;flex:1}
.nm{display:block;font-size:13px;font-weight:700}
.mt{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
.go{font-size:11px;color:var(--muted)}

.mods{margin-top:18px;padding-top:14px;border-top:1px solid rgba(104,87,68,.14)}
.mods-h{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.mods-h button{font-size:10.5px;color:var(--terra);font-weight:700}
.mod{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;font-size:12.5px;color:#5e574e;width:100%;text-align:left;transition:.15s}
.mod:hover{background:rgba(255,255,255,.7)}
.mod.on{background:var(--plum);color:#fff}
.mod .dot{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
.mod .num{margin-left:auto;font-size:9.5px;opacity:.6}

.banner{background:var(--sand-soft);border-left:3px solid var(--sand);color:#6b5326;padding:10px 14px;border-radius:11px;font-size:12px;margin-bottom:18px;display:flex;gap:8px;align-items:flex-start}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.card-h .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px}
.card-h b{font:700 16.5px/1.3 "Songti SC",serif}
.card-h small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:1px}
.card-act{margin-left:auto;display:flex;gap:7px;align-items:center}

.btn{height:36px;padding:0 14px;border-radius:10px;background:var(--plum);color:#fff;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:5px}
.btn:hover{opacity:.9}
.btn.line{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.tint{background:var(--plum-soft);color:var(--plum)}
.btn.terra{background:var(--terra)}
.btn.sm{height:30px;padding:0 11px;font-size:11.5px}
.btn.xs{height:26px;padding:0 9px;font-size:11px;border-radius:8px}

/* 人物首页 */
.hero{background:var(--plum);color:#fff;border-radius:var(--radius);padding:22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.hero .av{width:70px;height:70px;border-radius:20px;background:rgba(255,255,255,.18);font-size:28px}
.hero h2{font:700 24px/1.2 "Songti SC",serif;margin:0 0 4px}
.hero .sub{font-size:12px;opacity:.84;display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.hero .sub i{font-style:normal;background:rgba(255,255,255,.16);padding:2px 8px;border-radius:999px}
.hero-act{margin-left:auto;display:flex;gap:8px}
.hero .btn{background:#fff;color:var(--plum)}
.hero .btn.ghost{background:rgba(255,255,255,.16);color:#fff}

/* 完整度 */
.pf{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{width:92px;height:92px;flex:0 0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rt{position:absolute;inset:0;display:grid;place-items:center;font:700 20px/1 "Songti SC",serif}
.pf-txt{min-width:0;flex:1}
.pf-txt b{font-size:14px}
.pf-txt p{margin:5px 0 0;font-size:12px;color:var(--muted);line-height:1.55}
.mods-done{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.mchip{font-size:10.5px;padding:3px 9px;border-radius:999px;background:var(--sage-soft);color:var(--sage);font-weight:600}
.mchip.low{background:var(--sand-soft);color:var(--sand)}

/* 画像标签云 */
.cloud{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;padding:5px 11px;border-radius:999px;font-weight:600}
.tag.p{background:var(--plum-soft);color:var(--plum)}
.tag.t{background:var(--terra-soft);color:var(--terra)}
.tag.s{background:var(--sage-soft);color:var(--sage)}
.tag.d{background:var(--sand-soft);color:var(--sand)}
.tag.m{background:#efebe3;color:var(--muted)}

/* 关键节点 */
.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:11px}
.node{background:#fffdfa;border:1px solid var(--line);border-radius:13px;padding:12px}
.node span{font-size:10.5px;color:var(--muted);display:block}
.node b{font-size:14px;display:block;margin-top:4px}
.node em{font-style:normal;font-size:10.5px;color:var(--terra);display:block;margin-top:2px}

/* 进度条 */
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;display:flex;margin-top:7px}
.bar i{display:block;height:100%}

/* 字段 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>span{font-size:11px;color:var(--muted);font-weight:700}
.inp{height:37px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:#fffdfa;font-size:13.5px;width:100%}
textarea.inp{height:auto;padding:9px 11px;resize:vertical;min-height:64px;line-height:1.55}
.inp:focus{outline:2px solid var(--plum-soft);border-color:var(--plum)}
select.inp{cursor:pointer}

/* 词库缓存 */
.vocab-box{margin-top:6px}
.vocab{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:var(--sand-soft);border-radius:10px;border:1px dashed #d8c49a}
.vocab-l{font-size:10.5px;color:#8a6d33;font-weight:700;flex:0 0 auto}
.vc{font-size:11.5px;padding:3px 10px;border-radius:999px;background:#fffdfa;color:#6b5326;font-weight:600;border:1px solid #ddd0b4}
.vc:hover{background:var(--sand);color:#fff;border-color:var(--sand)}
.vc.add{background:transparent;border-style:dashed;color:#9c8250}
.multi{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mt-item{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 8px 4px 11px;border-radius:999px;background:var(--plum);color:#fff}
.mt-item button{color:rgba(255,255,255,.7);font-size:14px;line-height:1;padding:0}
.mt-item button:hover{color:#fff}
.add-row{display:flex;gap:7px;margin-top:9px}
.add-row .inp{flex:1}

/* 核心/更多 */
.core-h{display:flex;align-items:center;gap:8px;margin:16px 0 10px;padding-top:14px;border-top:1px dashed var(--line)}
.core-h b{font-size:12.5px}
.core-h .cnt{font-size:10.5px;color:var(--muted)}
.more-btn{display:flex;align-items:center;gap:7px;width:100%;padding:11px;border-radius:12px;background:#fffdfa;border:1px dashed var(--line);color:var(--muted);font-size:12.5px;font-weight:700;margin-top:12px}
.more-btn:hover{border-color:var(--plum);color:var(--plum)}
.more-btn svg{transition:.2s}
.more-btn.open svg{transform:rotate(180deg)}

/* 重复条目 */
.rep{border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px;background:#fffdfa}
.rep-h{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.rep-h b{font-size:12.5px;flex:1}
.rep-h button{color:var(--red);font-size:11px;font-weight:700;display:flex;align-items:center;gap:3px}

/* 列表行 */
.lrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fffdfa;margin-bottom:8px}
.lrow .m{flex:1;min-width:0}
.lrow .m b{display:block;font-size:13px}
.lrow .m small{font-size:11px;color:var(--muted)}
.amt{font-weight:700;white-space:nowrap}
.amt.out{color:var(--red)}.amt.in{color:var(--green)}
.badge{font-size:10.5px;padding:2px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
.badge.s{background:var(--sage-soft);color:var(--sage)}
.badge.d{background:var(--sand-soft);color:var(--sand)}
.badge.t{background:var(--terra-soft);color:var(--terra)}
.badge.p{background:var(--plum-soft);color:var(--plum)}
.badge.r{background:#fbe3e0;color:var(--red)}
.badge.g{background:var(--sage-soft);color:var(--green)}

/* 时间轴 */
.tl{display:flex;flex-direction:column}
.tl-i{display:flex;gap:11px;padding-bottom:14px;position:relative}
.tl-i::before{content:"";position:absolute;left:11px;top:23px;bottom:0;width:2px;background:var(--line)}
.tl-i:last-child::before{display:none}
.tl-dot{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:11px;z-index:1}
.tl-b{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fffdfa}
.tl-b .t{font-size:13px;font-weight:700;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tl-b .m{font-size:11px;color:var(--muted);margin-top:3px}
.tl-b .s{font-size:12.5px;margin-top:6px;color:#4a443c}

/* 提示条 */
.note{border-radius:11px;padding:10px 12px;font-size:12px;line-height:1.6}
.note.p{background:var(--sand-soft);color:#6b5326;border-left:3px solid var(--sand)}
.note.i{background:var(--sage-soft);color:#41553f;border-left:3px solid var(--sage)}
.note.pp{background:var(--plum-soft);color:var(--plum);border-left:3px solid var(--plum)}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(41,37,31,.5);display:grid;place-items:center;z-index:100;padding:20px;overflow-y:auto;backdrop-filter:blur(3px)}
.modal{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:640px;box-shadow:0 24px 60px rgba(41,37,31,.3);max-height:90vh;overflow-y:auto;margin:auto}
.modal-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.modal-h b{font:700 17px/1.3 "Songti SC",serif;flex:1}
.x{width:30px;height:30px;border-radius:9px;background:#f3ede4;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:var(--red);color:#fff}
.modal-f{display:flex;gap:9px;margin-top:18px;justify-content:flex-end}

/* R2 文件 */
.r2-path{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--muted);background:#f5f1e9;padding:2px 7px;border-radius:6px;word-break:break-all}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
.file{border:1px dashed var(--line);border-radius:13px;padding:14px;text-align:center;color:var(--muted);background:#fffdfa}
.file:hover{border-color:var(--plum);color:var(--plum)}
.file svg{width:25px;height:25px;margin:0 auto;display:block}
.file b{display:block;font-size:12px;color:var(--ink);margin-top:6px;word-break:break-all}
.file small{font-size:10px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted);font-size:13px;margin-top:11px;cursor:pointer}
.drop:hover{border-color:var(--plum);color:var(--plum)}

/* 日历条 */
.calbar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:8px 11px;background:var(--plum-soft);border-radius:11px;margin-bottom:11px}
.calbar b{font-size:11.5px;color:var(--plum)}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:#fff;color:var(--plum);font-weight:600}

.empty{padding:24px;text-align:center;color:var(--muted);font-size:13px;background:#fffdfa;border:1px dashed var(--line);border-radius:13px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:11px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;bottom:36px}

@media(max-width:900px){
  .side{position:static;width:auto;border-right:0;border-bottom:1px solid rgba(104,87,68,.12)}
  .main{margin-left:0;padding:16px 14px 50px}
  .shell{flex-direction:column}
}
</style>
</head>

<div class="shell">
  <aside class="side">
    <div class="brand"><span class="av">数</span><div><b>数字生活</b><small>人物档案 v2 演示</small></div></div>
    <button class="back" onclick="toast('演示：返回数字生活')">← 返回数字生活</button>

  </main>
</div>
<div class="toast" id="ts"></div>
<div id="modalBox"></div>

/* 档案完整度：各模块已填字段占比 */
function fillCount(id){
  const p = P(); let f=0,t=0;
  const cnt=(o)=>{ if(!o||typeof o!=='object') return [0,1];
    const vals=Object.values(o).filter(v=>v&&v!=='—');
    return [vals.length, Object.keys(o).length]; };
  if(id==='base'){ const [a,b]=cnt(p.core); return a+'/'+b; }
  if(id==='rel'){ const [a,b]=cnt(p.rel); return a+'/'+b; }
  if(id==='edu') return p.edus.length+'段';
  if(id==='work'){ const [a,b]=cnt(p.work); return a+'/'+b; }
  if(id==='family'){ const [a,b]=cnt(p.family); return a+'/'+b; }
  if(id==='pref'){ const [a,b]=cnt(p.pref); return a+'/'+b; }
  if(id==='trait'){ const [a,b]=cnt(p.trait); return a+'/'+b; }
  if(id==='interact') return p.interacts.length+'条';
  if(id==='promise') return p.promises.length+'条';
  if(id==='money') return p.money.length+'笔';
  if(id==='dates'){ const [a,b]=cnt(p.dates); return a+'/'+b; }
  if(id==='files') return p.files.length+'件';
  return '—';
}
function scoreOf(p){
  let got=0, all=0;
  const add=(o,keys)=>{ if(!o) return; keys.forEach(k=>{all++; if(o[k]&&o[k]!=='—'&&o[k]!=='') got++;}); };
  add(p.core,['alias','gender','phone','wechat','city','job']);
  add(p.rel,['type','level','via','since','scene','status']);
  add(p.work,['company','dept','title','field','give']);
  add(p.family,['father','mother','spouse','child','live']);
  add(p.pref,['life','social','size']);
  add(p.trait,['style','reply','value','taboo']);
  add(p.dates,['birth','greet','cycle','stale']);
  const dyn = p.edus.length + p.interacts.length + p.promises.length + p.money.length + p.files.length;
  all += 25; got += Math.min(25, dyn*2);
  return Math.round(got/all*100);
}

function tlItem(i){
  return `<div class="tl-i">
    <span class="tl-dot" style="background:var(--sage-soft);color:var(--sage)">◷</span>
    <div class="tl-b">
      <div class="t">${i.kind}<span style="font-weight:400;color:var(--muted);font-size:11px">${i.date} · ${i.place}</span></div>
      <div class="m">参与人：${i.who} · 主题：${i.topic} · 质量：<b style="color:var(--green)">${i.quality}</b></div>
      <div class="s">${i.summary}</div>
    </div>
  </div>`;
}
function daysTo(bd){
  if(!bd) return null;
  const [m,d] = bd.split('-').map(Number);
  const now = new Date(2026,9,9);
  let n = new Date(2026, m-1, d);
  if(n < new Date(2026,9,9)) n = new Date(2027, m-1, d);
  return Math.round((n - new Date(2026,9,9))/86400000);
}
function daysSince(s){
  if(!s||s==='—') return null;
  const n = new Date(s.replace(/-/g,'/'));
  return Math.round((new Date(2026,9,9) - n)/86400000);
}

// 已选项标签 + 可点击的缓存候选词
// 缓存候选词按字段分组（size/shoe 共用尺码词库）
const VOCAB_GROUP = { size:'size', shoe:'size' };
function vocabBox(key, selected, placeholder){
  vCache[key] = selected || vCache[key] || [];
  const g = VOCAB_GROUP[key] || key;
  return `<div class="fld" style="grid-column:1/-1">
    <span>${placeholder}</span>
    <div class="multi">${vCache[key].map((w,i)=>
      `<span class="mt-item">${w}<button onclick="rmVocab('${key}',${i})">×</button></span>`).join('')}</div>
    <div class="add-row"><input class="inp" id="in_${key}" placeholder="输入新词，回车添加">
      <button class="btn sm line" onclick="addVocab('${key}')">添加</button></div>
    <div class="vocab">
      <span class="vocab-l">📌 常用词（点击即用）</span>
      ${VOCAB[g].map(w=>`<button class="vc" onclick="quickAdd('${key}','${w}')">${w}</button>`).join('')}
    </div>
  </div>`;
}
function quickAdd(k,w){ if(!vCache[k].includes(w)){ vCache[k].push(w); render(); } }
function addVocab(k){ const el=document.getElementById('in_'+k); const v=(el.value||'').trim();
  if(v && !vCache[k].includes(v)) vCache[k].push(v); render(); }
function rmVocab(k,i){ vCache[k].splice(i,1); render(); }

    place:q('i_place')||'—', who:q('i_who')||'—', topic:document.getElementById('i_topic').value,
    quality:document.getElementById('i_q').value, summary:q('i_sum') });
  closeModal(); mod='home'; render(); toast('已记录，画像更立体了');
}

function openPromise(){
  modal('新增承诺 / 待办', `
    <div class="note pp" style="margin-bottom:12px">💡 保存后可在「待办提醒」中查看，日历中也能看到，并绑定当前人物。</div>
    <div class="grid">
      ${FL('谁答应', SID('pr_side','对方',['对方','我']))}
      ${FL('截止日期', FID('pr_due','2026-11-30','','date'))}
      ${FL('优先级', SID('pr_pri','P1',['P0','P1','P2','P3']))}
      ${FL('状态', SID('pr_st','未开始',VOCAB.status))}
    </div>
    <div style="margin-top:12px">${FL('承诺事项', FID('pr_what','','例：帮我内推其公司后端岗'))}</div>
    <div style="margin-top:10px">${FL('跟进记录', AID('pr_note','例：已发简历，等待面试安排'))}</div>
  `, 'savePromise()');
}
function savePromise(){
  const p=P(), q=(id)=>document.getElementById(id).value;
  p.promises.push({ id:Date.now(), side:q('pr_side'), what:q('pr_what')||'未填写', due:q('pr_due'),
    status:q('pr_st'), note:q('pr_note'), priority:q('pr_pri') });
  closeModal(); render(); toast('已保存，勾选「加入待办」可同步');
}
function toPushTodo(id){
  const p=P(), x=p.promises.find(v=>v.id===id); if(!x) return;
  if(DB.todos.some(t=>t.pid===p.id && t.what===x.what)) return toast('已在待办中');
  DB.todos.push({ id:Date.now(), pid:p.id, pname:p.name, what:x.what, due:x.due, status:x.status, priority:x.priority||'P1' });
  render(); toast(`已加入待办，可在待办页按「${p.name}」筛选`);
}

function openMoney(){
  modal('记一笔人情账', `
    <div class="note pp" style="margin-bottom:12px">💡 保存后会写入「我的账本」作为一条流水（备注自动 @ 当前人物），账本里也能反查。</div>
    <div class="grid">
      ${FL('类型', SID('m_type','送出',['送出','收到','借出','还款','AA结算']))}
      ${FL('金额', FID('m_amt','500','','number'))}
      ${FL('日期', FID('m_date','2026-10-09','','date'))}
    </div>
    <div style="margin-top:12px">${FL('备注', FID('m_note','','例：生日礼物 / 借出未还'))}</div>
    <div class="note i" style="margin-top:12px">🔗 账本分类建议：送礼 →「人情」类；金额与备注一并同步，便于在账本页按人物查询。</div>
  `, 'saveMoney()');
}
function saveMoney(){
  const p=P(), q=(id)=>document.getElementById(id).value;
  const type={ '送出':'gift_out','收到':'gift_in','借出':'lend','还款':'repay','AA结算':'aa' }[q('m_type')];
  const amt=Number(q('m_amt'))||0;
  p.money.unshift({ id:Date.now(), date:q('m_date'), type, amount:amt, note:q('m_note')||q('m_type') });
  DB.txns.unshift({ id:Date.now(), pid:p.id, pname:p.name, type, amount:amt, note:q('m_note'), date:q('m_date') });
  closeModal(); render(); toast('已记账，并同步到我的账本');
}

/* ===================== 提示 ===================== */
let tmr;
function toast(m){ const el=document.getElementById('ts'); el.textContent=m; el.classList.add('show');
  clearTimeout(tmr); tmr=setTimeout(()=>el.classList.remove('show'),2200); }

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
  // 词库输入框回车即添加
  if(e.key==='Enter' && e.target.id && e.target.id.startsWith('in_')){
    e.preventDefault();
    addVocab(e.target.id.slice(3));
  }
  // 联系方式输入框回车
  if(e.key==='Enter' && e.target.id && e.target.id.startsWith('ct_')){
    e.preventDefault();
    addContact(e.target.id.slice(3), e.target.id);
  }
});
render();
</script>
</body>
