name = "shuzishenghuo"
compatibility_date = "2024-11-01"
pages_build_output_dir = "./public"

# ===== D1 数据库（结构化数据） =====
[[d1_databases]]
binding = "DB"
database_name = "shuzishenghuo"
database_id = "f22fddc8-5f8f-4498-9dab-539fea617bba"

# ===== R2 存储桶（图片/附件） =====
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "shuzishenghuo"

# ===== 后台变量（管理员的用户名和密码） =====
# 注意：这里不要写 [vars]！
# Git 连接部署时 wrangler.toml 的配置会覆盖 Cloudflare 后台设置，
# 若在这里写死 ADMIN_USER / ADMIN_PASS / SESSION_SECRET，
# 后台修改的管理员账号密码会在每次推送后被覆盖。
# 请统一在 Cloudflare 控制台 → 本 Pages 项目 → 设置 → 环境变量 中配置：
#   ADMIN_USER      管理员用户名
#   ADMIN_PASS      管理员密码
#   SESSION_SECRET  会话签名密钥（随机长字符串）
# 修改变量后重新部署一次即可生效。
