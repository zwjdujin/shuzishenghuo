name = "shuzishenghuo"
compatibility_date = "2024-11-01"
pages_build_output_dir = "./public"

# ===== D1 数据库（结构化数据） =====
[[d1_databases]]
binding = "DB"
database_name = "shuzishenghuo"
# 用 `wrangler d1 create shuzishenghuo` 创建后得到的 id 填到这里
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# ===== R2 存储桶（图片/附件） =====
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "shuzishenghuo"

# ===== 后台变量（管理员的用户名和密码） =====
# 生产环境建议在 Cloudflare 控制台 “设置 > 环境变量” 里配置，或用 `wrangler secret put`
# 这里给的是占位默认值，部署前请务必改成你自己的。
[vars]
ADMIN_USER = "admin"
ADMIN_PASS = "change-me-please"
SESSION_SECRET = "change-me-session-secret"
