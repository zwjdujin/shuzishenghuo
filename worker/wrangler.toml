name = "shuzishenghuo-push"
main = "src/index.js"
compatibility_date = "2024-11-01"

# 改成你的 Cloudflare 账户 ID（控制台右下角或 wrangler whoami）
account_id = "YOUR_ACCOUNT_ID"

# 复用同一个 D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "shuzishenghuo"
database_id = "f22fddc8-5f8f-4498-9dab-539fea617bba"

# 每分钟触发一次（Cloudflare Cron Trigger）
[triggers]
crons = ["* * * * *"]

# VAPID 与邮件地址请用机密变量（不要写死在此文件）：
#   cd worker && wrangler secret put VAPID_PUBLIC
#   wrangler secret put VAPID_PRIVATE
#   wrangler secret put VAPID_MAILTO
#
# 部署：cd worker && npm install && wrangler deploy
